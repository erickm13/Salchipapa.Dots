# Adaptation of WezTerm colors to Alacritty (Dark Theme)

# Gruvbox Dark Hard Theme
[colors.primary]
background = "#1D2021"
foreground = "#ebdbb2"

[colors.cursor]
text = "#1d2021"
cursor = "#ebdbb2"

[colors.selection]
background = "#665c54"
text = "#ebdbb2"

[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"


[[colors.indexed_colors]]
index = 16
color = "#FFA066" # waveOrange

[[colors.indexed_colors]]
index = 17
color = "#2D4F67" # waveBlue1 (using as an additional distinct color)

[cursor]
style = "Underline"
unfocused_hollow = true

[font]
size = 17

[font.normal]
family = "IosevkaTerm NF"

[window]
option_as_alt = "Both"
opacity = 0.85
decorations = "none"
dynamic_title = false

[terminal]
shell = { program = "C:\\Windows\\System32\\wsl.exe", args = ["--cd", "~"] }


[env]
TERM = "xterm-256color"
