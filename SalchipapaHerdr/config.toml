onboarding = false

[ui]
# Barra lateral plegada al arrancar en modo compacto (como craftzdog): una columna fina con
# el número de cada workspace y el estado de su agente (○ libre, ● trabajando). Ctrl+g b la abre entera
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"

# Barra de pestañas al estilo de mi zjstatus. Sin `accent` propio: cada tema usa su color de
# pestaña activa (azul en solarized, amarillo en gruvbox)
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%A, %d %b %Y %H:%M" },
]
tab_bar_right_separator = "  "

# Al crear una pestaña (Ctrl+g c / Alt+t) herdr pide su nombre, como craftzdog (prompt_new_tab_name
# queda en true, el valor por defecto). Si se deja en blanco, fish le pone uno aleatorio

[ui.toast]
delivery = "system"

[theme]
# Tema de herdr, a juego con el de nvim. Se cambia con `theme <nombre>` (fish): toca esta línea y la
# de colorscheme.lua de nvim. solarized = como craftzdog; los paneles siguen transparentes
name = "solarized"
auto_switch = false


[keys]
# Ctrl+g como en zellij (en lugar de Ctrl+b)
prefix = "ctrl+g"

# Atajos directos con Alt, como en mi zellij (se conservan tambien los de Ctrl+g)
# Pestañas: Alt Shift h / Alt Shift l
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]
# Nueva pestaña: Alt t
new_tab = ["prefix+c", "alt+t"]
# Mover la pestaña de posicion: Alt i / Alt o
move_tab_previous = "alt+i"
move_tab_next = "alt+o"
# Foco entre paneles: Alt h j k l (como vim) o Alt + flechas
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
# Nuevo panel a la derecha: Alt n (como el NewPane por defecto de zellij)
split_vertical = ["prefix+v", "alt+n"]
# Nuevo panel abajo: Alt d (como la "d" del modo panel de zellij)
split_horizontal = ["prefix+minus", "alt+d"]
# Cerrar panel: Alt x / cerrar pestaña: Alt Shift x (la "x" de zellij)
close_pane = ["prefix+x", "alt+x"]
close_tab = ["prefix+shift+x", "alt+shift+x"]
# Teclas por defecto que se mueven para dejar sitio a los comandos de craftzdog (abajo):
# prefijo+g era el navegador de sesiones, prefijo+e el historial en el editor
# y prefijo+Shift+h/j/k/l intercambiaban paneles
goto = "prefix+u"
edit_scrollback = "prefix+shift+e"
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"
# Volver al último panel donde estabas (como el prefijo+; de tmux)
last_pane = "prefix+;"
# prefijo+o pasa a abrir la carpeta del panel; ir a la notificación queda en prefijo+Shift+o
open_notification_target = "prefix+shift+o"
# Redimensionar el panel sin entrar al modo redimensionar (como tmux-pain-control);
# el modo sigue en prefijo+r con flechas
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Lazygit en un panel ampliado, en el directorio del panel actual (se cierra al salir de lazygit)
[[keys.command]]
key = "prefix+g"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'
description = "lazygit"

# Cerrar los demás paneles de la pestaña
[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -r -n1 herdr pane close'''
description = "cerrar los demás paneles"

# Abrir la carpeta del panel actual en el explorador de archivos
[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'xdg-open "$HERDR_ACTIVE_PANE_CWD"'
description = "abrir la carpeta en el explorador"

# Subir / bajar el workspace actual en la lista (script en SalchipapaHerdr/bin)
[[keys.command]]
key = "ctrl+shift+up"
type = "shell"
command = '"$HOME/.local/bin/herdr-move-workspace" up'
description = "subir el workspace"

[[keys.command]]
key = "ctrl+shift+down"
type = "shell"
command = '"$HOME/.local/bin/herdr-move-workspace" down'
description = "bajar el workspace"

# ── Ideas de craftzdog/dotfiles ──────────────────────────────────
[terminal]
# Paneles y pestañas nuevos abren en el directorio del panel actual
new_cwd = "follow"

# En la barra lateral, Claude muestra el resumen de su sesión (el título de su
# terminal) en una segunda fila, en vez de solo el nombre del agente
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

# Sin sonido cuando Claude termina o pide algo (ya avisa con el toast del sistema)
[ui.sound.agents]
claude = "off"

[experimental]
# Guarda el contenido de los paneles en ~/.config/herdr/session-history.json para
# recuperarlo al reabrir. Ojo: lo que se vio en pantalla (tokens incluidos) queda en disco
pane_history = true
