# Lazygit (basado en craftzdog/dotfiles). Colores: el tema de Salchipapa-Shell (fish añade su
# lazygit-theme.yml a LG_CONFIG_FILE) o, al abrirlo desde nvim, los que pone snacks.nvim.
gui:
  scrollHeight: 30
  # Iconos de archivos y carpetas (Nerd Font v3), como desde nvim (snacks lo pone igual)
  nerdFontsVersion: "3"
git:
  autoFetch: false
  # delta toma line-numbers, syntax-theme y decoraciones de ~/.config/git/delta.gitconfig
  diffRenderers:
    - command: delta --dark --paging=never
customCommands:
  # C en archivos: Claude escribe el mensaje y hace commit de lo que está en stage
  # (función de fish SalchipapaFish/fish/functions/claude_commit.fish)
  - key: "C"
    command: "fish -c claude_commit"
    description: "commit con Claude Code"
    context: "files"
    loadingText: "Claude está haciendo el commit"
    output: terminal
