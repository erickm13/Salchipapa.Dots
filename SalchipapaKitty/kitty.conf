# Salchipapa.Dots — kitty (adaptado de SalchipapaAlacritty/alacritty.toml)
# Usa la shell por defecto del usuario (la que pone install.sh con chsh)

# ── Ventana ──────────────────────────────────────────────────
# Barra de titulo visible (para poder mover la ventana)
hide_window_decorations no
# No recordar tamaño/estado de ventana: kitty guardaba window-state=maximized en
# ~/.cache/kitty/main.json y abría CADA ventana maximizada (tapaba el tiling). Foot no hace esto.
remember_window_size no
background_opacity 0.75
window_padding_width 4
confirm_os_window_close 0

# ── Fuente ───────────────────────────────────────────────────
font_family      IosevkaTerm NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14

# ── Cursor ───────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.5

# ── Varios ───────────────────────────────────────────────────
enable_audio_bell no

# ── Solarized Osaka ──────────────────────────────────────────
background #001419
foreground #839395
cursor     #839395
cursor_text_color #001419
selection_background #1a6397
selection_foreground #839395

# normal
color0 #001014
color1 #db302d
color2 #849900
color3 #b28500
color4 #268bd3
color5 #d23681
color6 #29a298
color7 #9eabac

# bright
color8  #001419
color9  #db302d
color10 #849900
color11 #b28500
color12 #268bd3
color13 #d23681
color14 #29a298
color15 #839395

include salchipapa-colors.conf
