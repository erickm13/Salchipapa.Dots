name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: info
        run: |
          VERSION=${{ github.event.release.tag_name }}
          URL="https://github.com/erickm13/Salchipapa.Dots/archive/refs/tags/${VERSION}.tar.gz"
          SHA=$(curl -sL $URL | sha256sum | awk '{print $1}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: erickm13/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        run: |
          sed -i "s|url .*|url \"https://github.com/erickm13/Salchipapa.Dots/archive/refs/tags/${{ steps.info.outputs.version }}.tar.gz\"|" Formula/salchipapa-dots.rb
          sed -i "s|sha256 .*|sha256 \"${{ steps.info.outputs.sha256 }}\"|" Formula/salchipapa-dots.rb
          sed -i "s|version .*|version \"${{ steps.info.outputs.version }}\"|" Formula/salchipapa-dots.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Formula/salchipapa-dots.rb
          git commit -m "feat: update salchipapa-dots to ${{ steps.info.outputs.version }}"
          git push
