# CI: en cada push y pull request, sintaxis y lint de todo el repo (tests/check.sh) y pruebas de la
# memoria de agentes en un HOME temporal (tests/obsidian.sh), y secretos en todo el historial (gitleaks).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Sintaxis y lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish shellcheck jq
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: tests/check.sh
        run: bash tests/check.sh

  obsidian:
    name: Memoria de agentes (SalchipapaObsidian)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tests/obsidian.sh
        run: bash tests/obsidian.sh

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial: un secreto en un commit viejo también cuenta
      - name: Instalar gitleaks (binario oficial, checksum verificado)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar xzf "$tgz" gitleaks
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: gitleaks git
        run: gitleaks git --redact --no-banner --verbose .
