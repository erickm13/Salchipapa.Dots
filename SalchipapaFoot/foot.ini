include=/home/salchipapa/.config/foot/salchipapa-colors.ini
shell=fish
title=foot
font=PlemolJP Console NF:style=Text:size=16, JetBrains Mono Nerd Font:size=16
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.80
blur=yes

[key-bindings]
# Subir/bajar en el historial. En el portátil no hay PgUp/PgDn sueltas (son Fn+↑/↓): también
# Ctrl+Shift+K/J (página, como k/j en Vim) y Ctrl+Shift+↑/↓ (media página)
scrollback-up-page=Page_Up Control+Shift+k
scrollback-down-page=Page_Down Control+Shift+j
scrollback-up-half-page=Control+Shift+Up
scrollback-down-half-page=Control+Shift+Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
